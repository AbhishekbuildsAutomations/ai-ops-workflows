# n8n + Postgres for the ai-ops-workflows portfolio.
# Based on n8n's official withPostgres example:
# https://github.com/n8n-io/n8n-hosting/tree/main/docker-compose/withPostgres
#
# Secrets reach the containers as files under /run/secrets (n8n and Postgres both read
# <VAR>_FILE), not as environment variables. That matters here because the workflows read
# $env.TELEGRAM_CHAT_ID, which means env access in expressions is switched on: anything in
# n8n's environment is readable from a workflow. So only non-secret values live there.

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  n8n_encryption_key:
    environment: N8N_ENCRYPTION_KEY
  runners_auth_token:
    environment: RUNNERS_AUTH_TOKEN

volumes:
  db_storage:
  n8n_storage:
  twenty_data:
  twenty_clickhouse:
  twenty_storage:

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_DB
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      # postgres:18 moved its default data dir; pin it so the volume mount stays valid.
      - PGDATA=/var/lib/postgresql/data
    secrets: [postgres_password]
    volumes:
      - db_storage:/var/lib/postgresql/data
      # Runs once, when the volume is first created.
      - ./workflows/00-error-handling/sql/schema.sql:/docker-entrypoint-initdb.d/00-error-handling.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - ${N8N_PORT:-5678}:5678
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/postgres_password
      - N8N_ENCRYPTION_KEY_FILE=/run/secrets/n8n_encryption_key
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${GENERIC_TIMEZONE:-Asia/Kolkata}
      # Links in alerts point here.
      - N8N_EDITOR_BASE_URL=http://localhost:${N8N_PORT:-5678}
      # Public base URL for webhooks. Set it to your tunnel URL for WhatsApp (see README).
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:${N8N_PORT:-5678}}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-0}
      - N8N_SECURE_COOKIE=false # plain http on localhost
      - N8N_DIAGNOSTICS_ENABLED=false
      # Code nodes run in the separate n8n-runner container (internal mode is deprecated).
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN_FILE=/run/secrets/runners_auth_token
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # Defaults to blocked since n8n 2.0; workflows need $env.TELEGRAM_CHAT_ID etc.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Values the workflows read. Not secrets.
      - TELEGRAM_CHAT_ID
      - DIGEST_SHEETS_ENABLED=${DIGEST_SHEETS_ENABLED:-false}
      - DIGEST_SHEET_ID
      # Workflow 1: lead agent
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - HOT_LEAD_SCORE=${HOT_LEAD_SCORE:-70}
      - FOLLOWUP_HOURS=${FOLLOWUP_HOURS:-4}
      - DEDUPE_MINUTES=${DEDUPE_MINUTES:-30}
      - CRM_ENABLED=${CRM_ENABLED:-false}
      - TWENTY_URL=${TWENTY_URL:-http://twenty:2020}
      - WHATSAPP_PHONE_NUMBER_ID
      - WHATSAPP_VERIFY_TOKEN
      # The Code node that checks Meta's signature needs this. It is readable by any workflow
      # (env access is on); see Workflow 1 README, known limits.
      - WHATSAPP_APP_SECRET
    secrets: [postgres_password, n8n_encryption_key, runners_auth_token]
    volumes:
      - n8n_storage:/home/node/.n8n
      # Lets scripts/bootstrap.sh import the workflow JSON from inside the container.
      - ./workflows:/repo/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n-runner:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    depends_on:
      - n8n

  # --- Optional: Twenty CRM (free, open-source) for Workflow 1. `docker compose --profile crm up -d`
  # The all-in-one dev image seeds a demo workspace and a fixed API key that only works against
  # this local image (twentyhq/twenty: packages/twenty-sdk/src/cli/constants/dev-api-key.ts).
  # Demo use only: it runs NODE_ENV=development. Login: tim@apple.dev / tim@apple.dev
  twenty:
    image: twentycrm/twenty-app-dev:${TWENTY_VERSION:-v2.43.0}
    profiles: [crm]
    restart: unless-stopped
    ports:
      - ${TWENTY_PORT:-2020}:2020
    environment:
      - NODE_PORT=2020
      - SERVER_URL=http://localhost:${TWENTY_PORT:-2020}
    volumes:
      - twenty_data:/data/postgres
      - twenty_clickhouse:/data/clickhouse
      - twenty_storage:/app/packages/twenty-server/.local-storage

  # --- Optional: public HTTPS URL for the WhatsApp webhook. `COMPOSE_PROFILES=tunnel`
  # ngrok's free plan includes one permanent dev domain (https://ngrok.com/docs/pricing-limits/free-plan-limits/).
  ngrok:
    image: ngrok/ngrok:3
    profiles: [tunnel]
    restart: unless-stopped
    command: http n8n:5678 --url ${NGROK_URL:-https://set-NGROK_URL-in-.env.ngrok-free.app}
    environment:
      - NGROK_AUTHTOKEN
    depends_on:
      - n8n
